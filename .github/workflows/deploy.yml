name: Deploy Worker

# main에 코드·설정이 머지되면 Cloudflare Workers로 자동 배포한다.
# (README 등 비관련 변경은 paths 필터로 배포를 트리거하지 않는다.)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}   # 수동 실행(Actions 탭 → Run workflow)도 허용

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete coming-soon link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = '    <a href="https://samsungda-newsletter.cw120-park.workers.dev/preview" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:10px;font-size:13px;color:#5C6B79;text-decoration:none">coming soon &rarr;</a>\n'
          changed = []
          for name in ("src/index.js", "index.js"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if target in text:
                  path.write_text(text.replace(target, "", 1), encoding="utf-8")
                  changed.append(name)
          print("changed:", ", ".join(changed) if changed else "none")
          PY

          if ! git diff --quiet -- src/index.js index.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/index.js index.js
            git commit -m "fix: remove coming soon link [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
