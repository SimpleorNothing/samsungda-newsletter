name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check src/insights.js
          node --check src/insights-bootstrap.js
          node --check src/entry.js
          node --check src/index.js
      - name: Unit tests
        run: node --test
