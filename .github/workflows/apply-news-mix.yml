name: Apply newsletter mix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-news-mix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_news_mix.py

      - name: Syntax check
        run: node --check src/index.js && node --check src/diversity.js && node --check src/changelog.js

      - name: Commit applied change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[nl] 시장 동향 경쟁사 중심 3:1:1 배분" || exit 0
          git push origin HEAD:main

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
